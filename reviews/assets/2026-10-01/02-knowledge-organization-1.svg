<svg id="diagram2" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 556px;" viewBox="0 0 556 326" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#diagram2{font-family:Meiryo,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram2 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram2 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram2 .error-icon{fill:#552222;}#diagram2 .error-text{fill:#552222;stroke:#552222;}#diagram2 .edge-thickness-normal{stroke-width:1px;}#diagram2 .edge-thickness-thick{stroke-width:3.5px;}#diagram2 .edge-pattern-solid{stroke-dasharray:0;}#diagram2 .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram2 .edge-pattern-dashed{stroke-dasharray:3;}#diagram2 .edge-pattern-dotted{stroke-dasharray:2;}#diagram2 .marker{fill:#333333;stroke:#333333;}#diagram2 .marker.cross{stroke:#333333;}#diagram2 svg{font-family:Meiryo,sans-serif;font-size:16px;}#diagram2 p{margin:0;}#diagram2 .label{font-family:Meiryo,sans-serif;color:#333;}#diagram2 .cluster-label text{fill:#333;}#diagram2 .cluster-label span{color:#333;}#diagram2 .cluster-label span p{background-color:transparent;}#diagram2 .label text,#diagram2 span{fill:#333;color:#333;}#diagram2 .node rect,#diagram2 .node circle,#diagram2 .node ellipse,#diagram2 .node polygon,#diagram2 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#diagram2 .rough-node .label text,#diagram2 .node .label text,#diagram2 .image-shape .label,#diagram2 .icon-shape .label{text-anchor:middle;}#diagram2 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram2 .rough-node .label,#diagram2 .node .label,#diagram2 .image-shape .label,#diagram2 .icon-shape .label{text-align:center;}#diagram2 .node.clickable{cursor:pointer;}#diagram2 .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#diagram2 .arrowheadPath{fill:#333333;}#diagram2 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#diagram2 .flowchart-link{stroke:#333333;fill:none;}#diagram2 .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#diagram2 .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#diagram2 .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#diagram2 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#diagram2 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#diagram2 .cluster text{fill:#333;}#diagram2 .cluster span{color:#333;}#diagram2 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Meiryo,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#diagram2 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#diagram2 rect.text{fill:none;stroke-width:0;}#diagram2 .icon-shape,#diagram2 .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#diagram2 .icon-shape p,#diagram2 .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#diagram2 .icon-shape rect,#diagram2 .image-shape rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#diagram2 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#diagram2 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#diagram2 :root{--mermaid-font-family:Meiryo,sans-serif;}</style><g><marker id="diagram2_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><